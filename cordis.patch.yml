# dsh-commander-mode —— bundle patch 层。
#
# 这份 patch 声明**两个 agent preset**：指挥者模式（做判断、派活）与项目经理模式
# （六位开发流程专家 + 六段带门禁的流水线）。在 DSH 里，一个模式**就是**一个 agent
# preset —— 一份具名的子插件行清单，挂进该 preset 自己隔离的 scope 里。这一行用
# `@deepseek-ai/dsh-agent-preset`，即随附的通用声明器：它接受
# `{ id, name, description, order, plugins }`，并替你调用 `ctx.agentPresets.register()`。
#
# ⚠️ preset 是一份**完整组合**，不是全局工具集上的叠加层。
#
# `@deepseek-ai/dsh-web-app` 把它随附的每一个能力行都设成 `disabled: true`，然后在**每个
# preset 内部**重新声明它要的那些行。所以在桌面版里并不存在一个全局的 `read` 工具：它
# 之所以在，只是因为 `preset-standard` 把 `tool-fs` 列成了自己的子行。因此下面的
# `CAPABILITIES` 块镜像了 `@deepseek-ai/dsh-preset-standard`，好让本模式的表现等于
# 「标准模式 + 本插件 + 指挥者门禁」。已核对到 **DSH 0.2.2-rc.1**（对照
# `packages/bundle/web-app/presets/standard.patch.yml`）：随附 `standard` 顶层声明 22 行，
# 本块声明其中 18 行，除 `delegation` 组外每一行都逐字节相同 —— 差异是 `delegation`
# 组的内部构成（见下）。0.2.1-alpha.1 起 standard 新增 `time-context` 与 `tool-schedule`
# （0.2.1-rc.1 起再新增 `tool-plugin-market`），本次把前两者补进能力块、第三者列入排除。
#
# 故意**不**从 preset-standard 镜像的东西：
#
#   - `persona` —— 在一个没有声明它的 preset 里本来就已经生效，再声明一遍有产生重复
#     prompt section 的风险；
#   - `planning` / plan 模式 —— 60 行随附文案，而本模式自带的"规划 + 用选择工具让用户
#     确认"已经覆盖了同一件事，两套协议会互相干扰；
#   - `tool-plugin-manager` —— 随附时是禁用的（`disabled: !!js "!ctx.get('profileContext')"`，
#     它是给 创造模式 用的），而且装插件属于"执行操作"，本模式下应当派给子代理；
#   - `tool-plugin-market` —— 随附时也是 `disabled: true`；装插件市场里的东西同样属于
#     "执行操作"，本模式下应当派给子代理；
#   - **`tool-subagent` / `tool-subagent-fork` / `tool-subagent-control` /
#     `tool-subagent-control` 的 `list-agents` 子行** —— 见下。（0.2.2 已从该包移除
#     `list-agents` 子路径导出，list_agents 并进主入口；本块本来就不声明它。）
#
# ## 派发通道：交给「智能体团队」，不要旧的 subagent 控件
#
# 本模式的委派**依赖 `@deepseek-ai/dsh-experimental-agent-team-profile`**（插件页里的
# 「智能体团队」）。那个组合包做两件事：插入 `agent-team` 服务与 `tool-agent-team`
# （九个 Team 工具），并**禁用**旧的 `tool-subagent-control`、`tool-subagent` 与
# `tool-subagent-fork` 三行（0.2.2 起 `list-agents` 子路径导出已移除、list_agents 并进
# 主入口，所以不再有第四行可禁）。
#
# 所以这里**不**镜像 standard 的 delegation 组里的那三个 subagent 行：在 preset 里重新
# 声明它们，会把那个组合包刚刚关掉的旧控件又装回来，于是指挥者同时拿到两套
# `send_message` / `list_agents` / `interrupt_agent`，行为变得不确定。Team 工具本身
# **不需要在这里声明** —— `tool-agent-team` 的九个工具注册在每个 Team 成员 agent
# **自己的 ctx** 上（Lead 是隐式 Team 的 Lead，因此也是成员），与 preset 无关。
#
# 只保留 `workflow-ptc` + `tool-workflow`：它是与 Team 工具互补的编排通道（一次性扇出
# 多个 fresh 子代理），而 `agent-team-profile` 明确保留了 workflow 的 spawn 提供方。
#
# ⚠️ 代价（README 的「已知边界」也写明了）：如果用户在插件页关掉「智能体团队」，本模式
# 就没有 `spawn_teammate` / `send_message` / `wait_agent` / `team_task_*` 了。那时门禁会
# 自动放行（`lib/guard.js` 的 `canDelegate` 检查），模式退化成"只会做协议的普通 agent"，
# 而不是把会话卡死。
#
# ## 门禁
#
# 「指挥者不执行操作」由本插件在 `tools/pre-execute` 上确定性拒绝（`write` / `edit` /
# `pwsh` / `bash` / `job_kill` / `plugin_manager`）。之所以不在这里裁掉 `tool-fs` 或
# `tool-pwsh`：子代理通过 `agentPresets.composeFrom()` 加入**父会话的同一个 preset
# scope**，裁掉会让 teammate 也失去这些能力（per-child 的工具限制只能收紧、不能扩展）。
#
# 2.0.0 起同一道门禁还把「挂机等子代理」变成确定性拒绝：`wait_agent` 的 `timeout_ms`
# 超过配置行 `maxWaitMs`（默认 120000）时直接拒绝并给出纠正指令。只拦超长等待，
# `list_agents` / `team_task_list` / `send_message` 这类"读状态 / 唤醒队友"的工具不受影响。
#
# 显示文案：输入框渲染的是 `preset.name ?? preset.id`，而自己起了名的声明就自己拥有
# 文案 —— 只有那四个随附 preset（它们不发布 name）才会被翻译。所以下面这些字符串是原样
# 显示的。`order` 决定菜单排序；随附 preset 用的是 1..4，本包用 7（指挥者）/ 8（项目经理）。
#
# 层序提醒：所有 bundle patch 先跑，然后是 profile 自己的 cordis.patch.yml，最后是
# `--patch` 覆盖层。按 id 定向的 patch 会**整块替换** `config` 且从不深合并，所以 profile
# 层若要覆盖下面这个 preset，必须重述 `id`、`name`、`description`、`order` 以及整个
# `plugins` 列表。
#
# ## 本 patch 插入三行，不是一个
#
# 1. `commander-mode`（`dsh-commander-mode/host`）—— **profile 顶层配置行**。它持有
#    `Config`、提供 `commanderSettings` 服务、关掉自动设置页，**不注册任何工具**，所以不会
#    把能力泄漏到别的模式里。
# 2. `preset-commander` —— 模式声明行，里面的 `commander-mode-agent` 子行才是
#    「指挥者协议 + 门禁 + specialist 安装」。
# 3. `preset-project-manager` —— 第二份模式声明行：能力行与指挥者**逐字节一致**（只有
#    `skill-filesystem` 多一个 `customSkillDirs`，加载本包 `skills/` 目录），再加两行
#    `project-manager-agent`（项目经理协议 + 门禁 + 专家安装）与 `project-dev-workflow`
#    （六段流水线执行手册）。
#
# ⚠️ 两份 preset 共用同一份专家名册，而 `agentPresets.register()` 对 preset id 是全局唯一
# 的：两个模式都会急切挂载，后挂载的那一行会收到 `Duplicate agent preset`。项目经理行
# 对此有明确处理——检测到重复说明 preset 已由另一行注册好，它只补 `subagent_<id>` 工具，
# 不会因此丢掉专家通道（见 `project-manager.js` 的模块注释）。
#
# 为什么必须拆开：preset 子行是运行时挂载的 fiber，**不在 Loader 的 entry 树里**，而设置页
# 读的就是那棵树。把 `Config` 放在 preset 子行上，设置命名空间不可达、设置页卡片静默消失
# （dsh 0.2.1-rc.2 实测）。参考实现 dsh-multi-model-orchestrator 的结构相同。

- insert:
    # ---- 配置行（profile 顶层）------------------------------------------------
    # 持有 `Config`、提供 `commanderSettings` 服务、关掉自动设置页。
    #
    # ⚠️ 为什么配置不在 preset 里：preset 子行是**运行时挂载**的 Cordis fiber，不在 Loader
    # 的 entry 树里；而设置页的两条通路（`Config.listConfigs` 与 `settings.describe()`）
    # 都读那棵树。实测 0.2.1-rc.2：`Config` 声明在 preset 子行上时，设置命名空间不可达，
    # `configForms.whileServed(['commander-mode'])` 永远为假，设置页卡片**静默消失**。
    # 所以配置行必须是 profile 顶层行（与参考实现 dsh-multi-model-orchestrator 同构）。
    #
    # 行 id = 设置命名空间 = 客户端 `SETTINGS_NS` = `commander-mode`，四者必须一致。
    - id: commander-mode
      # ⚠️ 必须是**裸包名**（不含 `/`）：`dsh-client-modules` 判定一个 Loader 行有没有
      # client 半时，对含 `/` 的说明符直接放弃（`exactPackageSpecifier()` 返回 undefined）。
      # 写成 'dsh-commander-mode/host' 会让设置页永远找不到这个包的 client 半。
      name: 'dsh-commander-mode'
      # ⚠️ 下面每个键都必须在 host.js 导出的 `Config`（= lib/config.js）里声明：
      # 按 id 定向的 patch 整块替换 config、不做深合并。
      #
      # 只有 `specialists` 是 volatile：设置页编辑它时 Loader 只热更新运行中的引用
      # （不重载本行），配置行通过 `commanderSettings` 服务广播，模式行据此重建
      # specialist preset 与工具。其余字段是加载期配置。
      config:
        # 规划/拆分完成后必须先让用户确认（本模式的核心要求）。
        confirmPlan: true
        # 子代理之间有分歧时交回用户。
        escalateOnConflict: true
        # 写进协议的建议并行上限。
        maxTeammates: 4
        # 结算同步看板（每轮运行时上下文）+ 回合结束前的同步兜底。
        # 关掉只去掉这两样，协议里的结算同步要求仍在。
        syncGuard: true
        # 指挥者不许自己调用的工具；传 [] 可以只留协议约束。
        blockedTools:
          - write
          - edit
          - pwsh
          - bash
          - job_kill
          - plugin_manager
        # 是否把长文协议注册成 skill。
        registerSkill: true
        # ---- 0.6.0 工单账本与计划授权 --------------------------------
        # 工单账本：commander_ticket_* 工具 + 看板 + 计划授权门禁。
        # 关掉后退化为 0.5.0 行为（只有同步看板与协议）。
        ledger: true
        # 账本文件位置。空 = <DSH_HOME>/commander/<profile>.json。
        # 相对路径以 DSH_HOME 为基准；以 .json 结尾视为文件，否则视为目录。
        stateDir: ''
        # 派发新工作前必须有用户确认的计划授权（Mandate）。
        # 没有 ask_user_question（id=commander-plan，选项「确认，开始执行」）的确认，
        # 派发 specialist / subagent / workflow / spawn_teammate 会被确定性拒绝。
        requireMandate: true
        # 是否要求每次派发都带工单 id（specialist 的 ticket 参数 / Team 的 [ticket:t-N]）。
        requireTicket: true
        # 一次性 specialist 是否异步派发（0.7.0 默认开）：工具立即返回，完成时用一条
        # 「【指挥者·派工完成】」通知唤醒指挥者并写账本；关掉回退 0.5.0 的前台阻塞行为。
        asyncDelegation: true
        # 同一会话同时在飞的一次性 specialist 上限（1–12）。
        maxAsyncTasks: 4
        # ---- 0.8.0 / 1.0.0 Worker Session ------------------------
        # 每张工单一个独立 DSH Session + 独立目录。0.8.0 曾默认关闭；0.9.1 真机 Web E2E
        # 跑通全链路后，1.0.0 起默认开启。不想要就在 profile patch 里显式写 false——
        # 关闭后不注册 commander_worker_* 四个工具，派工语义回到 0.7（specialist / Team）。
        workerSessions: true
        # Worker 工作目录根；空 = <DSH_HOME>/commander/work。
        workRoot: ''
        # 每个指挥者会话同时最多几个 Worker Session（1–12）。
        maxWorkers: 3
        # 建 worker 目录后执行一次的 prepare 命令（可选；可用 DSH_COMMANDER_* 环境变量）。
        prepareCommand: ''
        # Worker Session 的权限预设（默认 danger-full-access；目录不是安全边界）。
        workerPermission: danger-full-access
        # 派发后多久没有新回报算"疑似停滞"（只进看板，不自动处理）。
        ticketStallMs: 600000
        # 账本最多保留多少张工单（超出后裁剪最老的已结束工单）。
        maxTickets: 100
        # ---- 1.1.0 外部事件（轻量 Trigger）-----------------------------
        # 外部系统（CI / 告警 / 定时巡检）往 <账本目录>/events/inbox/ 写 JSON 事件，
        # 本行轮询取走并 steer 对应指挥者会话（空闲会被唤醒）。默认开启。
        eventInbox: true
        # 轮询间隔（ms，最小 1000）。事件是分钟级，15 秒足够。
        eventPollMs: 15000
        # ---- 2.0.0 等待门禁 --------------------------------------------
        # 单次 wait_agent 的等待上限（ms）。历史会话里出现过 1800000ms（30 分钟）的
        # 超长等待（单次 127.5 分钟、会话累计 11 小时），用户复盘时明确要求
        # "等子代理不要一直等"。超过它的 wait_agent 会被 tools/pre-execute **确定性
        # 拒绝**并返回纠正指令；0 = 关闭门禁（只保留协议约束，不推荐）。
        maxWaitMs: 120000
        # 可配置的多模型 specialist 名册：每项一个 `subagent_<id>` 前台工具。
        #
        # 这里**故意不写** `specialists`：默认值就是出厂预置名册（lib/presets.js，按主流
        # 软件开发生命周期划分的 6 个专家，模型继承指挥者），开箱即用。想开箱为空就显式写
        # `specialists: []`；想换一套就把整份名册写在这里（按 id 定向 patch 会整块替换 config）。
        # 设置页的编辑会写进 profile 的 cordis.patch.yml，覆盖这份默认值。
        #
        # 名册条数上限（防御性：每项都意味着一个 preset + 一个工具）。
        maxSpecialists: 20

    # ---- 模式行（agent preset）-----------------------------------------------
    - id: preset-commander
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: commander
        name: 指挥者模式
        description: 接单、分析、规划与拆分，把执行全部派给子代理；自己不执行操作，规划与分歧都交回用户用选择工具确认。
        order: 7
        plugins:
          # ---- CAPABILITIES (mirrors @deepseek-ai/dsh-preset-standard) ----------
          # 从工作区加载 AGENTS.md —— 指挥者要靠工作区约定才知道"派出去的活"该守什么规矩。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # 0.2.1-alpha.1 起 standard 自带的时间上下文（每轮注入当前时间/时区）。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # read / glob / grep —— 指挥者只读侦察的手段；write / edit 也在这一行里，
          # 由 lib/guard.js 的门禁对指挥者拒掉，而子代理照常可用。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # 逐字镜像 0.2.2 preset-standard：applyPatch 默认 false（不提供 apply_patch）。
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # 0.2.1-alpha.1 起 standard 自带的定时任务能力（RRULE）。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 与 Team 工具互补的编排通道：一次性扇出多个 fresh 子代理。
          # （旧的 tool-subagent* 四个行**有意不在这里** —— 见文件头。）
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          # 本模式的两次"必须问用户"都靠它：规划确认与分歧上报。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 规划与进度板。
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # ---- end CAPABILITIES ----------------------------------------------
          # 模式行：协议 + 门禁 + specialist 安装。它**不持有配置**（配置在顶层的
          # `commander-mode` 行），只通过 `commanderSettings` 服务读配置。
          # preset 子行不在 Loader 树里、也不需要被 client-modules 扫描，所以用子路径
          # 出口没问题。
          - id: commander-mode-agent
            name: 'dsh-commander-mode/agent'

    # ---- 模式行（agent preset）：项目经理模式 -------------------------------
    # 与 preset-commander 的区别：指挥者解决"谁来做"，项目经理解决"按什么顺序做、
    # 每段怎么验收"。能力行与指挥者模式**逐字节相同**（除 skill-filesystem 多一个
    # customSkillDirs）；多出来的两行是模式协议与流水线执行手册。
    - id: preset-project-manager
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: project-manager
        name: 项目经理模式
        description: 用六位开发流程专家（架构 / 实现 / 审查 / 测试 / 安全 / 文档）跑一条带门禁的项目流水线，只编排与验收、不自己写代码。
        order: 8
        plugins:
          # ---- CAPABILITIES (mirrors @deepseek-ai/dsh-preset-standard) ----------
          # 从工作区加载 AGENTS.md —— 指挥者要靠工作区约定才知道"派出去的活"该守什么规矩。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          # 0.2.1-alpha.1 起 standard 自带的时间上下文（每轮注入当前时间/时区）。
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          # read / glob / grep —— 指挥者只读侦察的手段；write / edit 也在这一行里，
          # 由 lib/guard.js 的门禁对指挥者拒掉，而子代理照常可用。
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # 逐字镜像 0.2.2 preset-standard：applyPatch 默认 false（不提供 apply_patch）。
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # 0.2.1-alpha.1 起 standard 自带的定时任务能力（RRULE）。
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            # 项目经理模式额外加载本包 `skills/` 目录（19 个已吸纳的方法 skill）。
            # 只加在这一份：指挥者模式保持 1.x 的能力与文本不变。目录由本包提供，
            # 按包名定位包目录（createRequire(baseUrl)），不写死任何绝对路径。
            config:
              customSkillDirs:
                - !!js >-
                  process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-commander-mode/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # 与 Team 工具互补的编排通道：一次性扇出多个 fresh 子代理。
          # （旧的 tool-subagent* 四个行**有意不在这里** —— 见文件头。）
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          # 本模式的两次"必须问用户"都靠它：规划确认与分歧上报。
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          # 规划与进度板。
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          # ---- end CAPABILITIES ----------------------------------------------
          # 项目经理模式的两行：项目经理协议（角色 / 六段流水线门禁 / 等待纪律）与
          # 项目开发工作流（每段的必做动作、落盘产物、验收判据、返工与 skill 归位）。
          - id: project-manager-agent
            name: 'dsh-commander-mode/project-manager'
          - id: project-dev-workflow
            name: 'dsh-commander-mode/workflow'
