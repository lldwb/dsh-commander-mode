# dsh-commander-mode —— bundle patch 层。
#
# 这份 patch 声明**一个 agent preset**：指挥者模式（做判断、派活、按任务形状拆分与验收；
# 六位开发流程专家与六段工作流都是**按需**的）。在 DSH 里，一个模式**就是**一个 agent
# preset —— 一份具名的子插件行清单，挂进该 preset 自己隔离的 scope 里。本模式由
# **本包自带的等效声明器**（`dsh-commander-mode/preset-commander`，实现见
# `lib/preset-declaration.js`）注册：语义等价于随附的 `@deepseek-ai/dsh-agent-preset`
# （接受 `{ id, name, description, order, plugins }` 并调用 `ctx.agentPresets.register()`），
# 自带一份只是为了组件行标题能显示真实身份（见下）。**本模式不依赖随附的
# 「Agent 预设定义」那一行**——禁用 / 缺失它不会让本包的模式消失。
#
# 5.0.0：原先的「项目经理模式」已并入本模式。合并理由：两边的差别（专家团、六段工作流）
# 都是按需能力，不需要用两个模式来表达。
#
# ⚠️ preset 是一份**完整组合**，不是全局工具集上的叠加层。
#
# `@deepseek-ai/dsh-web-app` 把它随附的每一个能力行都设成 `disabled: true`，然后在**每个
# preset 内部**重新声明它要的那些行。所以在桌面版里并不存在一个全局的 `read` 工具：它
# 之所以在，只是因为 `preset-standard` 把 `tool-fs` 列成了自己的子行。
#
# ⚠️ **3.7.0 起本文件不再写 `plugins`**：能力行清单与模式行由
# `lib/preset-plugins.js` 从 `lib/capabilities.js`（单一来源）拼装，声明器在 `apply()`
# 里注入。所以下面的 preset 行只有 `id / name / description / order`。这样能力行只有
# 一份，不会因为"改了一边没改另一边"而静默漂移（此前这里有两份 ~84 行的逐字副本，
# 靠测试比对防漂移）。清单镜像了 `@deepseek-ai/dsh-preset-standard`，好让本模式
# 的表现等于「标准模式 + 本插件 + 指挥者门禁」。已核对到 **DSH 0.2.2-rc.1**（对照
# `packages/bundle/web-app/presets/standard.patch.yml`）：随附 `standard` 顶层声明 22 行，
# 本包声明其中 18 行，除 `delegation` 组外每一行都逐字节相同 —— 差异是 `delegation`
# 组的内部构成（见 `lib/capabilities.js`）。0.2.1-alpha.1 起 standard 新增 `time-context` 与 `tool-schedule`
# （0.2.1-rc.1 起再新增 `tool-plugin-market`），本次把前两者补进能力块、第三者列入排除。
#
# 故意**不**从 preset-standard 镜像的东西：
#
#   - `persona` —— 在一个没有声明它的 preset 里本来就已经生效，再声明一遍有产生重复
#     prompt section 的风险；
#   - `planning` / plan 模式 —— 60 行随附文案，而本模式自带的"规划 + 用选择工具让用户
#     确认"已经覆盖了同一件事，两套协议会互相干扰；
#   - `tool-plugin-manager` —— 随附时是禁用的（`disabled: !!js "!ctx.get('profileContext')"`，
#     它是给 创造模式 用的），而且装插件属于"执行操作"，本模式下应当派给子代理；
#   - `tool-plugin-market` —— 随附时也是 `disabled: true`；装插件市场里的东西同样属于
#     "执行操作"，本模式下应当派给子代理；
#   - **`tool-subagent` / `tool-subagent-fork` / `tool-subagent-control` /
#     `tool-subagent-control` 的 `list-agents` 子行** —— 见下。（0.2.2 已从该包移除
#     `list-agents` 子路径导出，list_agents 并进主入口；本块本来就不声明它。）
#
# ## 派发通道：交给「智能体团队」，不要旧的 subagent 控件
#
# 本模式的委派**依赖 `@deepseek-ai/dsh-experimental-agent-team-profile`**（插件页里的
# 「智能体团队」）。那个组合包做两件事：插入 `agent-team` 服务与 `tool-agent-team`
# （九个 Team 工具），并**禁用**旧的 `tool-subagent-control`、`tool-subagent` 与
# `tool-subagent-fork` 三行（0.2.2 起 `list-agents` 子路径导出已移除、list_agents 并进
# 主入口，所以不再有第四行可禁）。
#
# 所以这里**不**镜像 standard 的 delegation 组里的那三个 subagent 行：在 preset 里重新
# 声明它们，会把那个组合包刚刚关掉的旧控件又装回来，于是指挥者同时拿到两套
# `send_message` / `list_agents` / `interrupt_agent`，行为变得不确定。Team 工具本身
# **不需要在这里声明** —— `tool-agent-team` 的九个工具注册在每个 Team 成员 agent
# **自己的 ctx** 上（Lead 是隐式 Team 的 Lead，因此也是成员），与 preset 无关。
#
# 只保留 `workflow-ptc` + `tool-workflow`：它是与 Team 工具互补的编排通道（一次性扇出
# 多个 fresh 子代理），而 `agent-team-profile` 明确保留了 workflow 的 spawn 提供方。
#
# ⚠️ 代价（README 的「已知边界」也写明了）：如果用户在插件页关掉「智能体团队」，本模式
# 就没有 `spawn_teammate` / `send_message` / `wait_agent` / `team_task_*` 了。那时门禁会
# 自动放行（`lib/guard.js` 的 `canDelegate` 检查），模式退化成"只会做协议的普通 agent"，
# 而不是把会话卡死。
#
# ## 门禁
#
# 「指挥者不执行操作」由本插件在 `tools/pre-execute` 上确定性拒绝（`write` / `edit` /
# `pwsh` / `bash` / `job_kill` / `plugin_manager`）。之所以不在这里裁掉 `tool-fs` 或
# `tool-pwsh`：子代理通过 `agentPresets.composeFrom()` 加入**父会话的同一个 preset
# scope**，裁掉会让 teammate 也失去这些能力（per-child 的工具限制只能收紧、不能扩展）。
#
# 3.1.0 起「禁止等待子智能体」：`wait_agent` **无条件拒绝**（硬编码，**没有开关**；
# 3.2.0 起整条链生效：指挥官、小组长、子智能体一视同仁）。配置行里不存在 `maxWaitMs`
# 之类的键）。不等之后靠「【派工完成】」通知唤醒 +
# `list_agents` / `team_task_list` 读状态 + `send_message` 追问；
# `list_agents` / `team_task_list` / `send_message` 这类工具不受影响。
#
# 显示文案：输入框渲染的是 `preset.name ?? preset.id`，而自己起了名的声明就自己拥有
# 文案 —— 只有那四个随附 preset（它们不发布 name）才会被翻译。所以下面这些字符串是原样
# 显示的。`order` 决定菜单排序；随附 preset 用的是 1..4，本包用 7。
#
# 层序提醒：所有 bundle patch 先跑，然后是 profile 自己的 cordis.patch.yml，最后是
# `--patch` 覆盖层。按 id 定向的 patch 会**整块替换** `config` 且从不深合并，所以 profile
# 层若要覆盖下面这个 preset，必须重述 `id`、`name`、`description`、`order`。
# （`plugins` 由 `lib/preset-plugins.js` 注入，YAML 覆盖它不会生效。）
#
# ## 本 patch 插入两行
#
# 1. `commander-mode`（`dsh-commander-mode/host`）—— **profile 顶层配置行**。它持有
#    `Config`、提供 `commanderSettings` 服务、关掉自动设置页，**不注册任何工具**，所以不会
#    把能力泄漏到别的模式里。
# 2. `preset-commander` —— 模式声明行，里面的 `commander-mode-agent` 子行才是
#    「指挥者协议 + 门禁 + specialist 安装」，另加 `project-dev-workflow`（可选工作流手册，
#    只注册 skill、按需加载）。两行都由 `lib/preset-plugins.js` 从
#    `lib/capabilities.js` 单一来源拼装，本文件不重述。
#
# 为什么必须拆开：preset 子行是运行时挂载的 fiber，**不在 Loader 的 entry 树里**，而设置页
# 读的就是那棵树。把 `Config` 放在 preset 子行上，设置命名空间不可达、设置页卡片静默消失
# （dsh 0.2.1-rc.2 实测）。参考实现 dsh-multi-model-orchestrator 的结构相同。

- insert:
    # ---- 配置行（profile 顶层）------------------------------------------------
    # 持有 `Config`、提供 `commanderSettings` 服务、关掉自动设置页。
    #
    # ⚠️ 为什么配置不在 preset 里：preset 子行是**运行时挂载**的 Cordis fiber，不在 Loader
    # 的 entry 树里；而设置页的两条通路（`Config.listConfigs` 与 `settings.describe()`）
    # 都读那棵树。实测 0.2.1-rc.2：`Config` 声明在 preset 子行上时，设置命名空间不可达，
    # `configForms.whileServed(['commander-mode'])` 永远为假，设置页卡片**静默消失**。
    # 所以配置行必须是 profile 顶层行（与参考实现 dsh-multi-model-orchestrator 同构）。
    #
    # 行 id = 设置命名空间 = 客户端 `SETTINGS_NS` = `commander-mode`，四者必须一致。
    - id: commander-mode
      # ⚠️ 必须是**裸包名**（不含 `/`）：`dsh-client-modules` 判定一个 Loader 行有没有
      # client 半时，对含 `/` 的说明符直接放弃（`exactPackageSpecifier()` 返回 undefined）。
      # 写成 'dsh-commander-mode/host' 会让设置页永远找不到这个包的 client 半。
      name: 'dsh-commander-mode'
      # ⚠️ 下面每个键都必须在 host.js 导出的 `Config`（= lib/config.js）里声明：
      # 按 id 定向的 patch 整块替换 config、不做深合并。
      #
      # 只有 `specialists` 是 volatile：设置页编辑它时 Loader 只热更新运行中的引用
      # （不重载本行），配置行通过 `commanderSettings` 服务广播，模式行据此重建
      # specialist preset 与工具。其余字段是加载期配置。
      config:
        # 规划/拆分完成后必须先让用户确认（本模式的核心要求）。
        confirmPlan: true
        # 子代理之间有分歧时交回用户。
        escalateOnConflict: true
        # 写进协议的并行上限（3.0.0：8 → 16，与运行时「子智能体」设置对齐）。
        # 用户 2026-11-11 规则 2：并行上限取运行时的 subagent.maxActiveSubagents=16 与
        # agent-team.maxMembers=16，插件不再自己压低。想再往上要同时调 profile patch。
        maxTeammates: 16
        # 3.0.0 三层指挥链的确定性门禁（只有小组长能改进度/排期、指挥官不直调子智能体）。
        # 关掉退化为只靠协议约束（2.x 行为），文本仍在、但没有硬拦截。
        delegationHierarchy: true
        # 结算同步看板（每轮运行时上下文）+ 回合结束前的同步兜底。
        # 关掉只去掉这两样，协议里的结算同步要求仍在。
        syncGuard: true
        # 指挥者不许自己调用的工具；传 [] 可以只留协议约束。
        #
        # 2.2.0 起不只本地六个：判据是「会不会改变工作区 / 宿主 / 外部系统的状态」。
        # 历史事故（session-a0c0b646）：只拦本地工具时，指挥者本地 write/edit/pwsh 是 0 次，
        # 但它自己跑了 51 次 ssh_exec + 2 次 ssh_upload + 1 次 ssh_job 在远程 PC 上操作 ——
        # 用户看到的就是"亲力亲为"。远程执行 / 桌面注入 / 浏览器改动 / 模拟器控制 / 持久终端
        # 与 create_worktree 同样是"执行操作"。
        # 只读半边不受影响：ssh_host、desktop_screenshot/ui_dump/windows_list、
        # browser_snapshot/screenshot/console/network/status/list_pages、
        # android_status/screenshot/ui_dump/logcat、terminal_read/list、job_output/list。
        blockedTools:
          - write
          - edit
          - pwsh
          - bash
          - job_kill
          - plugin_manager
          - ssh_exec
          - ssh_job
          - ssh_upload
          - ssh_download
          - ssh_fetch
          - desktop_mouse_move
          - desktop_mouse_click
          - desktop_mouse_drag
          - desktop_mouse_scroll
          - desktop_key_press
          - desktop_type_text
          - desktop_ui_invoke
          - desktop_ui_set_value
          - desktop_window_focus
          - browser_connect
          - browser_disconnect
          - browser_navigate
          - browser_click
          - browser_type
          - browser_fill
          - browser_press_key
          - browser_hover
          - browser_drag
          - browser_upload_file
          - browser_handle_dialog
          - browser_evaluate
          - browser_close_page
          - android_avd_create
          - android_emulator_start
          - android_emulator_stop
          - android_apk_install
          - android_app_launch
          - android_app_stop
          - android_ui_tap
          - android_ui_swipe
          - android_ui_input
          - android_ui_key
          - terminal_open
          - terminal_send
          - terminal_signal
          - terminal_close
          - create_worktree
        # 是否把长文协议注册成 skill。
        registerSkill: true
        # ---- 0.6.0 工单账本与计划授权 --------------------------------
        # 工单账本：commander_ticket_* 工具 + 看板 + 计划授权门禁。
        # 关掉后退化为 0.5.0 行为（只有同步看板与协议）。
        ledger: true
        # 账本文件位置。空 = <DSH_HOME>/commander/<profile>.json。
        # 相对路径以 DSH_HOME 为基准；以 .json 结尾视为文件，否则视为目录。
        stateDir: ''
        # 派发新工作前必须有用户确认的计划授权（Mandate）。
        # 没有 ask_user_question（id=commander-plan，选项「确认，开始执行」）的确认，
        # 派发 specialist / subagent / workflow / spawn_teammate 会被确定性拒绝。
        requireMandate: true
        # 是否要求每次派发都带工单 id（specialist 的 ticket 参数 / Team 的 [ticket:t-N]）。
        requireTicket: true
        # 一次性 specialist 是否异步派发（0.7.0 默认开）：工具立即返回，完成时用一条
        # 「【指挥者·派工完成】」通知唤醒指挥者并写账本；关掉回退 0.5.0 的前台阻塞行为。
        asyncDelegation: true
        # 同一会话同时在飞的一次性 specialist 上限（1–16）。3.0.0：8 → 16（规则 2）。
        maxAsyncTasks: 16
        # ---- 0.8.0 / 1.0.0 Worker Session ------------------------
        # 每张工单一个独立 DSH Session + 独立目录。0.8.0 曾默认关闭；0.9.1 真机 Web E2E
        # 跑通全链路后，1.0.0 起默认开启。不想要就在 profile patch 里显式写 false——
        # 关闭后不注册 commander_worker_* 四个工具，派工语义回到 0.7（specialist / Team）。
        workerSessions: true
        # Worker 工作目录根；空 = <DSH_HOME>/commander/work。
        workRoot: ''
        # 每个指挥者会话同时最多几个 Worker Session（1–12）。2.4.0：3 → 6。
        maxWorkers: 6
        # 建 worker 目录后执行一次的 prepare 命令（可选；可用 DSH_COMMANDER_* 环境变量）。
        prepareCommand: ''
        # Worker Session 的权限预设（默认 danger-full-access；目录不是安全边界）。
        workerPermission: danger-full-access
        # 派发后多久没有新回报算"疑似停滞"（只进看板，不自动处理）。
        ticketStallMs: 600000
        # 账本最多保留多少张工单（超出后裁剪最老的已结束工单）。
        maxTickets: 100
        # ---- 1.1.0 外部事件（轻量 Trigger）-----------------------------
        # 外部系统（CI / 告警 / 定时巡检）往 <账本目录>/events/inbox/ 写 JSON 事件，
        # 本行轮询取走并 steer 对应指挥者会话（空闲会被唤醒）。默认开启。
        eventInbox: true
        # 轮询间隔（ms，最小 1000）。事件是分钟级，15 秒足够。
        eventPollMs: 15000
        # ---- 禁止等待子智能体（3.1.0，无配置项） -------------------------
        # 用户 2026-11-11 补充要求：禁止等待，且**不设开关**。`wait_agent` 由
        # tools/pre-execute 无条件拒绝（lib/guard.js 的 evaluateWaitForbidden()），
        # 这里没有 maxWaitMs 之类的键可配。历史会话里出现过 1800000ms（30 分钟）的等待、
        # 单次最长 127.5 分钟、会话累计 11 小时。
        # 可配置的多模型 specialist 名册：每项一个 `subagent_<id>` 前台工具。
        #
        # 这里**故意不写** `specialists`：默认值就是出厂预置名册（lib/presets.js，按主流
        # 软件开发生命周期划分的 6 个专家，模型继承指挥者），开箱即用。想开箱为空就显式写
        # `specialists: []`；想换一套就把整份名册写在这里（按 id 定向 patch 会整块替换 config）。
        # 设置页的编辑会写进 profile 的 cordis.patch.yml，覆盖这份默认值。
        #
        # 名册条数上限（防御性：每项都意味着一个 preset + 一个工具）。
        maxSpecialists: 20

    # ---- 模式行（agent preset）-----------------------------------------------
    # 5.0.0 起只有**一个**模式：「项目经理模式」已并入指挥者模式（专家团与六段工作流
    # 都是按需的，不需要第二个模式）。组合 = 能力行 + 指挥者模式行（协议 / 门禁 /
    # 专家安装）+ 可选工作流组件（`project-dev-workflow`，只注册 skill）。
    - id: preset-commander
      # 本包自带的等效声明器（子路径模块）：只为了让插件页组件行标题显示「指挥者模式」。
      # 组件行标题按「模块名」解析 locale（declaredRows → metaOf(row.name)），
      # 用随附的 @deepseek-ai/dsh-agent-preset 时标题会显示成通用的「Agent 预设定义」。
      # 语义与随附声明器一致（见 lib/preset-declaration.js）。
      name: 'dsh-commander-mode/preset-commander'
      config:
        id: commander
        name: 指挥者模式
        description: 接单、按任务形状拆分、派给小组长并逐项验收；自己不执行操作。专家团与六段工作流都是按需的（工作流用 skill 加载），不需要第二个模式。
        order: 7
        # 能力行 + 模式行 + 可选工作流行由 lib/preset-plugins.js 从 lib/capabilities.js
        # 单一来源拼装，这里**不再重述**（3.7.0 前这里有一份 ~84 行的能力行副本）。
