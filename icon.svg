<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="指挥者模式：中心调度，子代理执行">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f9d8f"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#g)"/>
  <!-- 指挥者：中心节点 -->
  <circle cx="32" cy="32" r="7.5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="3.2" fill="#1f9d8f"/>
